<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abseits einfach erklärt</title>
<style>
  :root { --bg:#0b0f15; --fg:#f2f4f8; --muted:#9aa6b8; --accent:#ffd23f; --card:#141b25; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:28px 16px 48px; }
  .kicker { color:var(--accent); font-weight:700; letter-spacing:.2em; font-size:13px; margin:0 0 6px; }
  h1 { font-size:clamp(26px,4.5vw,40px); margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h2 { font-size:18px; margin:28px 0 10px; }
  ol.chapters { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
  ol.chapters button { width:100%; text-align:left; background:var(--card); color:var(--fg); border:1px solid #243041; border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer; display:flex; gap:10px; }
  ol.chapters button:hover, ol.chapters button.active { border-color:var(--accent); }
  ol.chapters .t { color:var(--accent); font-variant-numeric:tabular-nums; min-width:38px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">REGELKUNDE</p>
  <h1>Die Abseitsregel – einfach erklärt</h1>
  <p class="sub">Erklärvideo mit Sprecher, ca. 2 Minuten. Mit Untertiteln im Bild.</p>
  <video id="v" controls preload="metadata" poster="abseits/poster.jpg" src="abseits-erklaert.mp4"></video>
  <h2>Kapitel</h2>
  <ol class="chapters" id="chapters"></ol>
</div>
<script>
  const CHAPTERS = [[0, 'Intro'], [10.6, 'Die Abseitslinie'], [28.1, 'Moment der Ballabgabe'], [45.3, 'Abseits!'], [65.5, 'Gleiche Höhe'], [80.1, 'Ausnahmen'], [91.7, 'Passives Abseits'], [103.9, 'Zusammenfassung']];
  const v = document.getElementById('v'), list = document.getElementById('chapters');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  CHAPTERS.forEach(([t, name]) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="t">${fmt(t)}</span><span>${name}</span>`;
    b.onclick = () => { v.currentTime = t + 0.05; v.play(); };
    li.appendChild(b); list.appendChild(li);
  });
  v.addEventListener('timeupdate', () => {
    let idx = 0; CHAPTERS.forEach(([t], i) => { if (v.currentTime >= t) idx = i; });
    [...list.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('active', i === idx));
  });
</script>
</body>
</html>
